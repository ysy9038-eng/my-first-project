<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document13 변수 선언과 사용 </title>
 </head>
 <body>
  <script>
	let currentYear=2025;	// 기준 연도
	let birthYear;			// 태어난 연도
	let age;				// 나이
	
	birthYear = prompt("태어난 연도를 입력해주세요.(YYYY)","")
	age = currentYear - birthYear +1;
	document.write("<b>"+currentYear + "년</b> 현재<br>");
	document.write("<b>"+birthYear + "년</b>에 태어난 사람의 나이는<b>"+age+"세</b> 입니다.");
  </script>
 </body>
</html>
