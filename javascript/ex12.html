<!DOCTYPE html>
<html lang="en">
 <head>
 <title>Document12 콘솔로 오류 확인</title>
 </head>
 <body>
  <h2>콘솔창을 켜 오류를 확인해보세요!</h2>
  <p>F12 → console</p>
  <p>Ctrl Shift j</p>
  
  <script>
	let now = new Date();
	let show = now.toLocaleTimeString();
	
	document.write("현재 시간 : "+show;);  
	// 일부러 오류 발생시켜 확인해보기!!
	</script>  
 </body>
</html>
