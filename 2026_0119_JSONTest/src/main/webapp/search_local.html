<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
 <!-- Bootstrap 3.x -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<style type="text/css">
	#box{
	width:1000px;
	margin: auto;
	margin-top: 30px;
	
}
</style>

<script type="text/javascript">

// YMCA
let x = 128.589859652042;
let y = 35.870627034367;

window.onload = function(){
	
	//내 위치 구하기
	navigator.geolocation.getCurrentPosition((position) => {
		  
		x=position.coords.longitude; //경도
		y=position.coords.latitude;	//위도
		
		console.log("x",x);
		console.log("y",y);
		
		});
	
		/*	navigator.geolocation.getCurrentPosition(function(position){});
		navigator.geolocation.getCurrentPosition((position)=>{});
		navigator.geolocation.getCurrentPosition(position=>{});	*/

};	//end : window.onload()

function find(){
	
	let query 	= $("#query").val().trim();
	
	let radius 	= $("#radius").val();
	let page	= $("#page").val();
	let size	= $("#size").val();
	
	if(query ==""){
		alert("검색어를 입력하세요!");
		$("#query").val("");
		$("#query").focus();
		return;
	}
	
	//jQuery Ajax 이용
	$.ajax({
		url		:	"local/list.do",
		data	:	{
					"query":query,
					"radius":radius,
					"x"		: x,
					"y"		: y,
					"page"	: page,
					"size"	: size
					},
		success	: function(res_data){
			
			$("#disp").html(res_data);
		
		},
		
		error	: function(err){
			
			alert(err.responseText);
		}
	});
	
}

</script>

</head>
<body>
<div id="box">
	<form class="form-inline">
	
		검색어 : <input class="form-control" id="query">
				 <input class="btn btn-primary" type="button" value="검색" onclick="find();">
				 
		&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
		
		반경:<select class="form-control" id="radius">
			<option value="100">100</option>
			<option value="500">500</option>
			<option value="1000" selected="selected">1000</option>
			<option value="2000">2000</option>
			<option value="5000">5000</option>
			<option value="10000">10000</option>
		</select>
	
			&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
		페이지	: <select class="form-control" id="page">
					<option value="1">1 페이지</option>
					<option value="2">2 페이지</option>
					<option value="3">3 페이지</option>
					<option value="4">4 페이지</option>
					<option value="5">5 페이지</option>
				</select>
	
			&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
		페이지당 게시물수: <select class="form-control" id="size">
					<option value="5">5개씩 보기</option>
					<option value="10" selected="selected">10개씩 보기</option>
					<option value="15">15개씩 보기</option>
				
				</select>
	
	
	</form>

<hr>
<!-- 결과화면 출력 -->
<div id="disp"></div>




</div>


</body>
</html>
