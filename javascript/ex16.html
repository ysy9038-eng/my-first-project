<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document16</title>
 </head>
 <body>
  <script>
	let input = prompt("숫자 입력");
	
	if( input !== null && input.trim() !== "" ){	// 취소, 공백
		let num = Number(input);
		if( !iNaN(num) ){	// isNaN : 숫자 아니다
			if( num % 3 === 0){
				document.write("3의 배수 O");
			}else {
				document.write("3의 배수 X");
			}
		}else{
			alert("숫자를 입력해주세요.");
		}
	}else{
		alert("입력이 취소되었거나 빈 값입니다.");
	}
  </script>
 </body>
</html>
