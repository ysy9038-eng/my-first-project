<!DOCTYPE html> 이 문서는 HTML 파일이다 라고 브라우저에게 알려줌
<html>
	< HTML > 포함되는 기본적인 내용은
	 < head > < body > 요소 이다.
 <HEAD>
	제목을 포함하는 html 문서의 머리(head)
	html 문서는 대소문자를 구별안함.
	HTML과 html은 같다
	<title0> 제목 </title>
	해당 문서의 제목을 나타냄
	문서를 표시하는 영역에는 나타나지 않음
	문서를 대표하는 목록, 북마크, 창 등에 표시되고 검색에서도 사용됨
 </head>
 <body>
	해당 문서의 본체/몸통(body)를 말하며
	문서의 내용이 들어가는 주된 부분
	거의 모든 부분의 명령 요소(element)들이 이곳에 위치함
  </body>
</html>
