<!DOCTYPE html>
<html lang="en">
 <head>

  <title>Document21</title>
 </head>
 <body>
  <h2>SELECT + OPTION 태그</h2>
	- 사용자에게 선택목록 제공, 드롭다운 목록 생성						<br>
	<h3>주요 속성</h3>
		- size, selected										<br>
	
	<br>
	<form>
		<h4>통신사</h4>
		<select name="tel">
			<option value="KT">KT</option>
			<option value="U+"selected>U+</option>
			<option value="SKT">SKT</option>
			<option value="알뜰폰">알뜰폰</option>
		</select><br>
		
		<input type="submit" value="선택완료">
		<button type="submit">선택완료2</button>
	</form>
	
	<br>
	<form>
		<select name="choice" size="3">
			<option value="1">선택항목 -1</option>
			<option value="2">선택항목 -2</option>
			<option value="3">선택항목 -3</option>
			<option value="4" selected>선택항목 -4</option>
			<option value="5">선택항목 -5</option>
			<option value="6">선택항목 -6</option>
		</select> <br>
		<input type="submit" value="선택완료">
		<input type="reset" value="다시선택">	<br>
		<button type="submit">선택완료</button>
		<button type="reset">다시선택</button>
	</form>
	
	<br>
	<h3>TEXTAREA 태그</h3>
		- 여러 줄 텍스트 입력					<br>
		
	<br>
	<form>
		<b>자기소개</b>									<br>
		<textarea name="textbox1"></textarea>	<br>
		<textarea name="tb2" rows="5" cols="50"></textarea> <br>
		<input type="submit" value="작성완료">
		<input type="reset" value="다시쓰기">
	</form>
	
	<br>
	<h3>label 태그</h3>
		- for 속성은 input 태그의 id 속성과 연결됨			<br>
		- label 클릭 시 input이 포커스 됨					<br>
	<br>
		<b>label 사용 전</b>
	id:<input type="text" name="id">					<br>
	pw:<input type="password" name="pw">				<br>
	name:<input type="text" name="name">				<br>
	birth:<input type="date" name="birth">				<br>
	
	<br>
	<form>
		<b>label 사용 후</b>								<br>
		<label for="아이디">아이디</label>
		<input type="text" name="id" id="아이디" required>			<br>
		<label for="비밀번호">비밀번호</label>
		<input type="password" name="pw" id="비밀번호" required>	<br>
		<label for="이메일">이메일</label>
		<input type="email" name="email" id="이메일" required>		<br>
		<button type="submit">전송</button>				
	</form>
 </body>
</html>
