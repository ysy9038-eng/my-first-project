<!--
	document.write()
	- 브라우저 화면 출력
	-HTML 문서에 직접 내용을 기록
	- 태그 사용 가능 <h2>, <b>, ...
	
	document.write("내용");
	document.write("<h2>내용</h2>")
-->

<!DOCTYPE html>
<html lang="en">
 <head>
 <title>Document10 간단한 입출력 -document.write()</title>
 </head>
 <body>
  <h2>document.write();사용</h2>
  <script>
	document.write("안녕하세요.");
	document.write("<h1>안녕하세요.</h2>")
	document.write("<p style='color:green'>hello JS~</p>");
  </script>
 </body>
</html>
