<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- Bootstrap 3.x -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<style type="text/css">
#box{
	width:1000px;
	margin: auto;
	margin-top: 30px;
}
</style>
<script type="text/javascript">
 	
 	function find(){
 		
 		let b_name 	= $("#b_name").val().trim();
 		let page 	= $("#page").val();
 		let display	= $("#display").val();
 		
 		if(b_name == ""){
 			
 			alert("검색할 상품명을 입력하세요");
 			$("#b_name").val("");
 			$("#b_name").focus();
 			return;
 		}
 		
 		//page를 이용한 start 계산
 		let start = (page-1) * display + 1
 		
 		//	jQuery 이용한 Ajax통신
 		$.ajax({
 			url		:	"book/list.do",
 			data	: 	{
 							"b_name":b_name,
 							"start":start, 
 							"display":display
 						},
 			success	:	function(res_data){
 				
 				//res_data:book/list.do 호출한 결과 화면(book_list.jsp)
 				$("#disp").html(res_data);
 				
 			},
 			error	:	function(err){
 				alert(err.responseText);
 			}
 		});
 	}
 </script>
</head>
<body>
<form class="form-inline">
	<div id="box">
		상품명:<input class="form_control" id="b_name">
				<input class="btn btn-primary" type="button" value="검색"  onclick="find();">
		
		&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
			
		페이지:<select class="form-control" id="page">
			<option value="1">1 페이지</option>
			<option value="2">2 페이지</option>
			<option value="3">3 페이지</option>
			<option value="4">4 페이지</option>
			<option value="5">5 페이지</option>
		
		</select>
		
		&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
		
		조회건수: <select class="form-control" id="display">
					<option value="10">10개씩 보기</option>
					<option value="20">20개씩 보기</option>
					<option value="30">30개씩 보기</option>
				</select>
		<hr>
		
		<!-- 검색결과 영역 -->
		<div id="disp"></div>
	</div>
</form>
</body>
</html>
