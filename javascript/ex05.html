<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document04 조건문</title>
 </head>
 <body>
  <!--
	1) if문
		if( 조건 ){
			조건이 true 일 때 실행할 코드
		}
	2) if~else문
		if( 조건 ){
		
		} else {
			조건이 false일 경우 실행
		}
	3) if~else if~else문
		if( 조건1){
			조건1이 true
		}else if( 조건2 ){
			조건2 true
		}else{
			// 조건1이 fal, 조건2 모두 false
		}
		
	4) 삼항(조건)연산자
		조건 ? true 일 경우 : false 일 경우 ;
		
	5) switch 문
		여러 값을 비교할 경우 사용
		조건식이 아닌 값을 비교
		숫자, 문자열 모두 가능
		break 사용하지 않으면 아래 case 로 계속 내려감
		
		switch( 값 ){
			case 값1:
					코드;
					break;
			case 값2:
					코드;
					break;
			...
			default:
				// 어떤 case에도 해당되지 않을 경우 실행
				코드; /*해당되는 값이 없을 경우 default 위에감?!*/
		}
  -->
 </body>
</html>
