<!DOCTYPE html>
<html lang="en">
 <head>
 <title>Document04 Universal Selector</title>
	<style>
		*{
			margin:0;	/* 바깥쪽 여백 */
			padding:0;	/* 안쪽 여백 p태그와 p태그 사이의 여백 CSS 영역안이라 CSS 주석*/
		}
		body{ background-color:#eee; }
	</style>
 </head>
 <body>
	<h2>전체 선택자</h2>
	<p>문서의 모든 요소에 스타일을 적용할 때 사용.</p>
	<p>전체 선택자는	* (별)을 사용.</p>
	<p> *{속성:값;} 형태로 사용.</p>
	<p>브라우저 기본 여백 제거(Reset CSS) 목적으로 자주 사용 됨.</p>
	<img src="C:/ymca-ysy/web/html/images/Harrypotter.webp">
 </body>
</html>
<!--
	margin
		- 요소 바깥쪽 여백
		- 요소와 요소 사이의 여백을 조정하는데 사용.
		- 요소의 경계 바깥에 위치하여 요소 외부의 여백을 늘리거나 줄임.
	
	padding
		- 요소의 안쪽 여백.
		- 요소의 내용과 경계 사이의 여백 조정.
		- 요소의 경계(border) 안쪽에 위치하여 요소 내부의 여백을 늘리거나 줄임.
-->
