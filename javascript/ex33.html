<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document33</title>
 </head>
 <body>
<!--
	1. 함수 (Function)
		- 여러개의 코드를 하나로 묶어 '반복 사용'이 가능하도록 만든 '코드 블럭'
		- 필요할 때 '호출'하여 사용
		- 재사용, 가독성 ↑, 유지보수 ↑, 구조화된 프로그램 작성 가능
	
	2. 선언과 호출
		-선언
		function 함수명(매개변수){
			실행문;
			...
		}
		
		-호출
		함수명();		// 매개변수 없음
		함수명(값);	// 매개변수 필요 시
		
		
	3. 매개변수(Parameter) / 인수(Argument)
		매개변수	: 함수 내부에서 사용할 변수 -변수이름
		인수		: 함수를 호출할 떄 전달하는 값 -실제 값
		
		function call(name){
			document.write(name+"님 안녕하세요~");
		}
		
		call(java);	// java님 안녕하세요~
		
		
	4. 반환값/리턴(return)
		- 함수가 작업을 마치고 결과로 되돌려주는 값
		- return을 만나면 함수는 즉시 종료됨
		
		function add(a, b){
			return a+b;
		}
		
		let result = add(5, 9);	// 14

	5. 익명 함수(Anonymous Function)
		- 함수 이름이 없음
		- 변수를 사용해 함수를 저장, 사용 하는 방식
		- 이름이 없는 함수는 단독으로 존재할 수 없음
		- 반드시 변수 / 매개변수 / 리턴값 등에 담겨야 함
		- 함수 표현식	: 함수를 하나의 값처럼 변수에 대입하는 방식
			변수 = 함수;	// let call = function(){ ... };
		
		let hello = function(){
			console.log("hello~");
		};
		
		hello();	// 익명 함수 사용!
		
		
	6. 화살표 함수
		- 익명 함수를 좀 더 짧게 표현
		- function 키워드 사용 안함		
		- 기본형태
		(매개변수) => {실행문}
		
		let hi = () => {
			console.log("hello~");
		};
		
		* 매개변수 한개 괄호 → 생략 가능
		let hi = name => console.log( name +", hi~");
		
		* 실행문 return문 하나뿐이면, {}와 return 생략 가능
		let add = (x,y) => x+y;
		
	
	7. 함수 호이스팅
		- 함수 선언문은 끌어올려져서 선언보다 먼저 호출해도 실행됨

		call();		// OK
		function call(){ console.log("hey"); }
		
		- 익명 함수/화살표 함수인 경우 변수 호이스팅만 되고 초기화 전까지 사용 불가 → 오류

		hello();	// NO
		let hello = function(){};

	8. 콜백 함수
		- 함수를 인수로 전달하는 함수
		
		setTimeout( function(){
			console.log("3초 후 실행");
		} , 3000 );

-->
 </body>
</html>
