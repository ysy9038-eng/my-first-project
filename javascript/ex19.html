 <body>
  <script>
	// 1 ~ 10까지의 합
	let sum=0;				/* let i; let sum=0;*/
	for(let i=1; i<11; i++){
		sum += i;
	}
	document.write("1부터 10까지의 합 :<b> "+Number(sum)+"</b></br>");
	</script>
	
	<script>
	// 1 ~ 100까지의 합
	sum=0;
	let sum1=0;				
	for(let i=1; i<101; i++){
		sum1 += i;
	}
	console.log("<h3>1부터 100까지의 합 :<b>"+Number(sum1)+"</b3>");
  
	</script>
</body>
