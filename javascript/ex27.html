<!DOCTYPE html>

 <body>
   <!--
	addNumber() 함수의 지역변수 sum 변수는 함수 외부에서 사용 못함.
	콘솔창	: 컨트롤+쉬프트+제이
 -->
	<script>
		function addNumber(){
			var sum = 10+20;
		}
		addNumber();
		console.log(sum);
	</script>
 </body>
