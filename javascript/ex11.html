<!--
	console.log()
	- 콘솔 출력
	- 개발자 도구 콘솔에 값 출력
	- F12 → 개발자 도구
	- Ctrl + Shift + J → 콘솔
	- 화면에 보이지 않음
	- 오류 확인 / 변수 값 확인용
	- HTML 태그 적용 안됨
-->

<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document11 간단한 입출력 -consol.log</title>
 </head>
 <body>
  <h2>console.log() 사용</h2>
  <script>
	console.log("로그 찍기 테스트");
	console.log("현재 시간 : ", new Date().toLocaleTimeString());
	
	alert("콘솔을 열어 확인하세요! F12 누르세요.")
  </script>
 </body>
</html>
