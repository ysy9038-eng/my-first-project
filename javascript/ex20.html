<!DOCTYPE html>
<html lang="en">
 <head>
 <title>Document20 구구단</title>
 </head>
 <body>
  <h3>구구단</h3>
  <script>
  let dan;/* let dan, num; */
  let num;
  for( dan=2; dan<=9; dan++){ /*ForEx06070809보기*/
		document.write("<h3>"+dan+"단</h3>");
	  for( num=1; num<=9; num++){
		document.write( dan +"x"+num+"="+(dan*num)+"<br>");
	  }/*먼저 써주세요 곱하기 처럼 써주도록 X 더하기 
	  출력출력출력이 계속 붙을거라 뒤에 br해주기*/
	/* document.write("<br>") */
  }
  </script>
 </body>
</html>
