<!DOCTYPE html>
<html lang="en">
 <head>

  <title>Document04 자료형 / 연산자 </title>

 <body>
  <!--
  자료형(Data Type)
			1)기본 자료형(Primitive Types)
				숫자(Number)		: 정수/실수 (소수점 유/무)
								  (자바와 다르게 정수형, 실수형이 구분되지 않음)
				문자(string)		: 따옴표("" 또는 '') /* 큰 따옴표안에 사용할 땐 작은따옴표 사용 가능*/
				논리형(boolean)	: true/false
				
			2) 복합 자료형 (Object Types)
				배열(array)		: 여러개의 값 저장
								: 배열명 [값1, 값2, 값3, ..] 예) let arr = ["1","2","3","4"]
								: [] 빈 배열 선언
								: index 사용 0, 0번부터 시작
								
				객체(Object)		: 함수와 속성 함께 포함.
					
			3) 특수 자료형		(Special Types)	
				undefined		: 변수가 선언되었지만 값이 없는 상태/*선언만 되어 있다*/
								: 자료형이 지정되지 않은 상태
								
				null			: 유효하지 않은 값
								: 비워놓기 위해 의도적으로 사용하는 값
								
		예) let a = 10; // number
			let b = "hello"	// string
			let c = true;	// boolean
			let d = null;	// null
			let e;			// undefined (선언만 (), 값 X)
			
		+) 변수의 자료형 확인 (typeof 연산자)
		consol.log(typeof 10);	// number
		typeof "aaa"			// string
		typeof true				// boolean
		
		
								
	연산자
		1) 산술 연산자
			+ - * / %(나누고 남은 값)
			++ -- /* 증감 연산자* 선/후 주의/
		2) 대입 연산자
			=  += -= *= /= %=
			
		3) 연결 연산자
			+	문자열을 연결( 숫자 + 숫자 + 문자열 / 숫자 + 문자열 + 숫자)
			
		4) 논리 연산자
			|| AND 하나라도 true이면 결과 true
			&&	OR 모두 true 이어야 결과 true 
			!	NOT 반대값
			
		5) 비교 연산자 
			: 결과 true / false
			: 대소문자 비교 → 아스키/유니코드 값 비교 /*65<97*/
			< > <= >=
			==		값만 비교(느슨한 비교 → 자동 타입 변환)
			===		값, 자료형 모두 비교(엄격한 비교)
			
			!=		값만 비교 
			!==		값, 자료형 모두 비교 /* 자료형이 바뀔수 있으니 얘를 쓰는 방향으로..*/ 
			예) 5 == "5" 5			5	==5(숫자 5로 형변환)	비교 true
				0 == false			0	== 0(false 숫자 형변환	)	비교	true
			
			/*문자는 유니코드 문자표로 비교, 대문자 A65가 소문자 a90보다 작음*/
			
			"A">"a"				false
			"cat" < "dog"		false
			
			let a= "APPle;"
			let b = "apple";
			
			a.toLowerCase() === b.toLowerCase()	// true
			
			toLowerCase
			
			
			toLowerCase()/* 다른 언어들에도 있음*/
			→ 문자열을 모두 소문자로 변환하는 메서드
-->
 </body>
