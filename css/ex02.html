<!DOCTYPE html>
<html lang="en">
 <head>
 <title>Document02 Internal Stylesheet</title> <!-- 내부 스타일 시트 -->
	<style>
		h2{
			padding:10px;
			background-color:#222;
			color:#fff;
		}	
		 </style><!--태그안에 적용을 하는 방식이 내부 스타일 방식 -->
 </head>
 <body>
	<h2>내부 스타일 시트</h2>
	<p>문서 안에서 사용할 스타일을 같은 문서 안에 정리한 것.</p>
	<p>모든 스타일 정보는 < HEAD >< /HEAD >태그 안에서 작성해야 함./* 웬만하면 소문자로 권장*/</p>
	<p> < style >< /style >태그 안에 작성.</p>
	<p>여러 페이지가 아닌 작성된 '단일 문서'에서 스타일을 맞출 때 사용.</p>
 </body>
</html>
