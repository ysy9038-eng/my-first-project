 <body>
   <!--
	자바스크립트에서 변수 선언 시 사용하는 키워드
	var, let, const
	셋 중 하나라도 사용하지 않은 변수 전역변수로 간주 → 키워드없는 변수 사용 금지!!!!!
 -->
	<script>
		function addNumber(){
			var sum = 10+20;	// 지역변수
			multi = 10*20;		// 전역변수
		}
		addNumber();
		console.log(multi);
	</script>
 </body>
