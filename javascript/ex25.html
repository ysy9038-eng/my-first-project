<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document25 배열(Array)</title>
 </head>
 <body>
  <!--
	1. 배열
		- 여러개의 값을 하나의 변수에 순서대로 저장하는 자료 구조
		- 자바스크립트의 배열은 숫자, 문자열, 객체, 함수 등 여러 자료형을 함께 저장할 수 있음
		- 각 요소에는 번호(인덱스, index)가 붙고, 0부터 시작함.
		
		index	: 요소의 위치 번호
		length	: 배열의 길이(요소 개수)
	
	2. 배열의 값 꺼내기
		1) 인덱스로 접근
			- 배열의 특정 위치 값을 읽을 때 사용
			- 인덱스는 항상 0부터 시작
			- 기본 형태
				배열명[인덱스]
			
		2) 기본 for문 (length 사용)
			- length 를 사용하면 배열의 길이가 바뀌어도 끝까지 반복 가능
			- 기본 형태
				for(let i=0; i<배열명.length; i++ ){
					// 배열명[i]
				}
				
		3) for...of 문
			- 인덱스가 필요 없고 값만 순서대로 꺼낼 때 사용
			- Java의 향상된 for문(for-each)와 동일한 역할
			- 기본 형태
				for(let 변수 of 배열명){
					// 변수 → 배열의 값
				}
				
		4) forEach() 메서드
			- 배열이 가진 내장 함수
			- 가장 많이 사용됨
			- Java 컬렉션에서의 forEach()와 거의 동일한 개념
			- 기본 형태
				 배열명.forEach(function(값, 인덱스, 배열자체){
					// 반복될 코드
				 });
			- 매개변수
				: 매개변수 이름은 마음대로 바꿀 수 있지만 역할 순서는 바꿀 수 없음.
				값(value)		: 배열에서 현재 꺼낸 요소 (생략 불가)
				인덱스(index)		: 현재 요소의 위치 번호
				배열자체(array)	: 원본 배열 전체
			
		5) 구조 분해 할당
			- 배열에서 앞쪽 일부 값만 변수로 꺼낼 때 편리
			- 위치(index) 기반으로 값을 꺼냄
			- 필요한 개수만큼만 꺼내도 되고, 배열이 더 길어도 문제 없음
			- 기본 형태
				배열명 = [값1, 값2, 값3, 값4, ... ];
				let [변수1, 변수2, 변수3] = 배열명;
	
	3. 배열 자체를 바꾸는 메서드
		1) push()	: 배열 뒤에 값 추가
			scores.push(90);	// [10, 20, 30, 90]

		2) pop()	: 배열 마지막값 제거, 그 값을 리턴
			let num = scores.pop();		// [10, 20, 30] , num의 값 90

		3) indexOf(): 값이 몇번째 index에 있는지 찾기(없으면 -1 리턴)
			scores.indexOf(20);		// 1
			scores.indexOf(90);		// -1
-->
 </body>
</html>
