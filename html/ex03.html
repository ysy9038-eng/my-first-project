<!DOCTYPE html>
<html lang="en">
 <head>
 
  <title>Document</title>
 </head>
 <body>
	머릿글자(heading)		<br />
	각 단계의 제목을 표시	<br />
	<H1>1단계</H1>
	<h2>2단계</h2>
	<H3>3단계</H3>
	<H4>4단계</H4>
	<H5>5단계</H5>
	<h6>6단계</h6>
	h1 태그가 가장 크다. <br>
	
	머릿글자는 일반 문서의 글자에 비하여 크고 더 굵은 글자로 표현 <br>
	제목들을 표시하기 위한 것.							<br>
	앞 문장과 뒷 문장을 분리하기 위해 줄바꿈을 적용.			<br>
	시작태그와 종료태그 안에 내용을 넣어 사용.				<br>
	<h3>hello html~~</h3>
 </body>
</html>
