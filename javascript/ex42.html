 <body>
	<ul>
		<li><a  onclick="changeBg('green')">Green</a></li>
		<li><a  onclick="changeBg('orange')">Orange</a></li>
		<li><a  onclick="changeBg('purple')">Purple</a></li>

	<!-- 색상 바뀌는 박스 -->
	<div id="result"></div>
	
	
<script>
	function changeBg(color){
		let result = document.querySelector('#result').style.backgroundColor = color;
	}
</script>
