<!--
  CSS(Cascading Style Sheets -캐스케이딩 스타일 시트)
	- 웹 문서의 내용에 상관없이 '디자인만' 따로 변경할 수 있는 기술. 웹문서 작성 언어는 HTML, 
	- HTML	: 웹 사이트 구조/내용을 작성.
	- CSS	: 작성된 내용을 화면에 어떻게 보일지 디자인.
	내용과 디자인이 분리되어 있어 유지보수에 매우 유리함. 분리시킬수 있다는 뜻
	
	CSS 장점
		한 번 스타일을 정의하면 여러 HTML 요소에 재사용 가능
		전체 웹 디자인을 한 곳에서 통합적으로 수정 가능 
		구조(HTML)와 표현(CSS) 분리 → 유지보수 크게 향상
	
	스타일 시트( Style Sheet) //CSS를 사용하는 기술명
		- CSS는 '스타일 시트'라는 문서를 작성하는 기술.
		- HTML 요소에 적용할 디자인 규칙들을 묶어 놓은 것.
		- 적용 방식 : Inline / Internal / External(유지보수편리)
		- 이 중 외부스타일시트(External)가 가장 많이 사용 됨.
	
	CSS 기본 문법
		선택자{ 속성1 : 값1; 속성2 : 값2; 속성3 : 값3; .. } 세미콜론이 하나하나의 속성값을 구분하는 기호
		
		- 선택자 : 어떤 태그에 스타일을 적용할지 지정 속성1(color): 값1(blue)
		- {}	: 스타일 규칙 영역 스타일 규칙=하나의 속성:값;
		- 스타일 규칙 : 속성과 값이 하나의 쌍으로 이루어짐 ( 속성:값; ) // 세미콜론없어도 적용, 하나있을땐 생략가능, 가능한 본래대로..
		- ;(세미콜론) : 여러개의 스타일을 구분하는 역할
		
		+) CSS의 Cascading(캐스테이딩)은 // 계단식 위와 아래가 있음
			여러 스타일이 겹칠때 어떤것을 우선 적용할지 결정하는 규칙.
	
	CSS 스타일 적용 예
		p{ text-align:center; color:blue; } // 글자의 정렬 가운데 한줄로 쓰면가독성 안좋음 
		p{
			text-align:center;				/* 글자 가운데정렬  */ 
			color: blue;					/*글자 파랑색*/			줄바꿈과 들여쓰기로 작성 , p태그에 정렬과 코드 적용;
		}
		→ 두가지 모두 같음, 작성방식 차이!
		
	CSS 주석
		- /* 주석내용 */
	
	선택자(Selector)
		- HTML 요소를 어디에 적용할지 지정하는 규칙
		- 타입, 클래스, 아이디, 그룹, 하위, 형제 ..,가상요소, 가상클래스...
 -->
