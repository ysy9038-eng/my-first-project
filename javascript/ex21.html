<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document21 구구단 css 적용</title>
  <link rel="stylesheet"href="C:/ymca-ysy/web/javascript/css/gugudan.css">
 </head>
 <body>
  <script>
	let dan, num;/* 바깥에 하기 싫으면 for문 안에 해도 됨*/
	
	for( dan=2; dan<10; dan++){
		document.write("<div>");
		document.write("<h3>"+dan+"단</h3>");
		for( num=1; num<10; num++){
			document.write(dan+"x"+num+"="+dan*num+"<br>");
			}
		document.write("</div>");
	}
  </script>
 </body>
</html>
