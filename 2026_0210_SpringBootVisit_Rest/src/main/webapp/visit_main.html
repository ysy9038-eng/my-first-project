<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
  <!-- Bootstrap 3.x -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<style type="text/css">
	#box {
		width: 700px;
		margin: auto;
		margin-top: 20px;
	}
	
	#title{
		text-align: center;
		font-size: 25px;
		color: rgb(51, 122, 183);
		text-shadow: 1px 1px 1px black;
	}
	
	.common{
	
		border: 1px solid #eeeeee;
		border-radius: 3px;
		padding: 5px;
		margin: 5px;
	}
	
	.content{
		min-height: 80px;
	}
	
	text area{
		resize: none;
	}
	
</style>

<script type="text/javascript">

//-------------------------------------------------------------------------------
 $(document).ready(function(){
	 
	 visit_list();
	 
 });
//--------------------------------------------------------------------------------
	function visit_list(){
		
		$.ajax({
			type		:	"GET",
			url			:	"rest/visits",
			dataType	:	"json",
			success		: 	function(res_data){
				//console.log(res_data);
				//res_data = {"createDate":"2026-02-11","list":[ {}, {}, {} .... ]}
				let visit_array = res_data.list;	
				//console.log(list);
				
				let html = "";
				
				for(let i=0 ; i < visit_array.length ; i++){
					
					let visit = visit_array[i]; // visit =  {"name":"홍길동","content":"내용"....}
					//console.log(visit.name); 
					
					html += `
						 <div class="panel panel-primary">
					      	<div class="panel-heading"><b>${ visit.name }</b> 님의 글:</div>
					      	<div class="panel-body">
					      		<div class="common content">${ visit.content }</div>
					      		<div class="common regdate">
					      			등록일자 : ${ visit.regdate }<br>
					      			수정일자 : ${ visit.regdate }
					      		</div>
					      		<div class="common">
					      		비밀번호: <input id="c_pwd">
					      				<input class="btn btn-info" type="button" value="수정">
					      				<input class="btn btn-danger" type="button" value="삭제">
					      		</div>
					      	</div>
					     </div>
					`; //자바스크립에서 지원되는스트링템플릿

					
				}//end:for
				
				//출력위치에 생성된 HTML을 넣는다
				$("#disp").html(html);
				
				
			},
			error: function(err){
				alert(err.responseText);
			}
		});
	
	}
//------------------------------------------------------------------------------
	function visit_insert_form(){
	
		let html =`
				<form>
			<div class="panel panel-primary">
		      <div class="panel-heading"><h5>글쓰기</h5></div>
		      <div class="panel-body">
		      	<table class="table">
		      		<tr>
		      			<th>이름</th>
		      			<td><input class="form-control" name="name"></td>
			      	</tr>
		      		<tr>
		      			<th>내용</th>
		      			<td><textarea class="form-control" rows="5" name="content"></textarea></td>
			      	</tr>
			      	<tr>
		      			<th>비밀번호</th>
		      			<td><input class="form-control" type="password" name="pwd"></td>
			      	</tr>
			      	
			      	<tr>
			      		<td colspan="2" align="center">
			      			<input class="btn btn-success" type="button" value="목록보기"
			      				   onclick="visit_list();">
			      			<input class="btn btn-primary" type="button" value="등록하기"
			      				   onclick="visit_insert(this.form);">
			      		</td>
			      	</tr>
		      	</table>
		      </div>
		  	</div>
		  </form>
		 `;
	
		//현재 화면을 id="disp"에 넣는다
		$("#disp").html(html);
	}

//-------------------------------------------------------------------------------
	function visit_insert(f){
	
		let name	 = f.name.value.trim();
		let content	 = f.content.value.trim();
		let pwd		 = f.pwd.value.trim();
	
		if(name==""){
			alert("이름을 입력하세요!");
			f.name.value="";
			f.name.focus();
			return;
		}
		
		if(content==""){
			alert("내용을 입력하세요!");
			f.content.value="";
			f.content.focus();
			return;
		}
		
		if(pwd==""){
			alert("비밀번호를 입력하세요!");
			f.pwd.value="";
			f.pwd.focus();
			return;
		}
		
		let data = {"name": name, "content": content, "pwd": pwd };
		// JSON.stringify(json) -> String형식의 데이터로 변환
		// JSON.parse("{'name': '홍길동', 'age':20}")-> {'name':'홍길동','age':20}
		
		$.ajax({
			
			type		:	"POST",
			url			:	"rest/visit",
			contentType	:	"application/json",
			data		:	JSON.stringify(data),
			dataType	:	"json",
			success		:	function(res_data){
							//res_data = { "result": true } or { "result": false }
							if(res_data.result==false){
								alert("등록 실패!!");
								return;
							}
							
							//등록성공시
							visit_list();
							
			},
			error		:	function(err){
				alert(err.responseText);
			}
			
		});
	}


//-------------------------------------------------------------------------------


</script>

</head>
<body>

	
 <div id="box">
 	<h1 id="title">::::Rest 방명록::::</h1>
	
	<div style="margin-top: 20px; margin-bottom: 5px;">
		<input class="btn btn-primary" type="button" value="글쓰기" 
					  onclick="visit_insert_form();">
	</div>	 
	
	<!-- 내용 -->
	<div id="disp"></div>
 </div>
 
</body>
</html>
