 <body>
  <script>
	let num = prompt("숫자를 입력해주세요."); //"" 공백도 문자
	if( num%3 === 0){
		document.write("<h3>3의 배수 입니다.</h3>");
	}else {
		document.write("<h4>3의 배수가 아닙니다.</h4>")
	}
  </script>
