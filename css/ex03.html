 <link rel="stylesheet" href="C:/ymca-ysy/web/css/css/style.css">
 <body>
  <h2>외부 스타일 시트</h2>
  <p>디자인 일관성이 있도록 스타일을 사용하는데 별도 파일로 지정해놓고 필요할 때마다 가져와서 사용.</p>
  <p>별도 파일은	*.css	확장자를 사용.</p> /* 프로그래밍언어에서 *은 전체 */
  <p>외부 스타일 시트 연결할 때 < link > 태그 사용. < style >< /style > 태그 사용 안함.</p>
  <p> < link rel="stylesheet" href="외부 스타일 시트의 파일 경로" > 형태로 사용.</p>
  <p>가장 많이 사용되는 방식, 유지보수와 재사용성이 뛰어남.</p>
 </body>
