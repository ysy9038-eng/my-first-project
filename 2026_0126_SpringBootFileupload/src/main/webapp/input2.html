<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<script type="text/javascript">
 function send(f) {
	
	 let title = f.title.value.trim();
	 //javascript내에서 이름이 동일한 parameter는 배열처리
	 let photo1 = f.photo[0].value;
	 let photo2 = f.photo[1].value;

 	if(title==""){
 		alert("제목을 입력하세요!");
 		f.title.value="";
 		f.title.focus();
 		return;
 		
 	}
 	
 	
 	
 	if(photo1==""){
 		alert("사진1을 선택하세요!");
 		return;
 	}
 	
 	if(photo2==""){
 		alert("사진2을 선택하세요!");
 		return;
 	}
 	
 	
 	f.action = "upload2.do";	//대상
 	f.submit();	//전송
 }
 
</script>
</head>

<body>

<!-- 
	화일업로드 form속성
	1.method = POST
	2.enctype = "multipart/form-data"
 -->
<form method="POST" enctype="multipart/form-data">

	제목 : <input name="title"><br>
	<!-- 업로드 화일이 여러개 있을 경우 parameter이름을 동일하게 설정 -->
	사진1 : <input type="file" name="photo"><br>
	사진2 : <input type="file" name="photo"><br>
	
			 <input type="button" value="전송" onclick="send(this.form);">
		
</form>

</body>
</html>
