<!DOCTYPE html>
<html lang="en">
 <head>
 <title>Document01 Inline Style</title>
 </head>
 <body>
	<h2>인라인 스타일</h2>
	<p style="color:green;">인라인 스타일을 요소에 적용해보자.</p> <!--하나일때 생략해도 적용 된다. 좁은 범위가 우선순위 강함--> 
	<p>태그 안에 style 속성을 해당 태그'만' 스타일 적용.</p>
	<p> < 태그 style="스타일규칙" > 형태로 사용. </p>
	<p>가장 우선순위가 강하지만, 코드가 지저분해지므로 실무에서 거의 사용하지 않음.</p>
 </body>
</html>
