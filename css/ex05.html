<!DOCTYPE html>
<html lang="en">
 <head>
	<title>Document05 Type Selector</title>
	<style>
		h2{ color:red; }
		p{ font-style:italic; }
	</style>
 </head>
 <body>
  <h2>타입 선택자</h2>
  <p>특정 태그를 사용하는 모든 요소에 스타일 적용.</p>
  <p> 태그명{ 스타일규칙 } 형태로 사용.</p>
  <p>모든 HTML 요소(Element)는 선택지로 사용 가능.</p>
  <p>문서 전체에 동일 태그를 한번에 스타일링할 때 유용.</p>
 </body>
</html>
