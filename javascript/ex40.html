<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document40</title>
 </head>
 <body>
 <!--
	1. 이벤트(event)
		- 사용자의 행동(클릭, 키보드, 마우스 등 다양)
		- 어떤 행위를 했을 때 함수를 실행해라
		버튼 클릭 → 함수 실행
	  
	2. 이벤트와 함수
		- 이벤트	: 언제 실행할지
		- 함수	: 무엇을 실행할지
		- 이벤트가 발생하면 연결된 이벤트 처리 함수가 실행됨
	
		예)이벤트 종류
		마우스 이벤트
		mouseout	: 마우스가 요소를 벗어났을 때 발생
		dbclick		: 클릭
		키보드 이벤트, 폼 이벤트 등등 다양함...
	
	3. DOM(Document Object Model)
		- 문서 객체 모델
		- HTML 문서를 자바스크립트가 다룰 수 있도록 만든 객체 구조
		- javaScript는 HTML을 직접 만지는 것이 아니라
			DOM 객체를 통해 간접적으로 조작함. /* html을 자바스크립트로 조작할 수 있도록 만든 중간구조 */
			
	4. HTML과 DOM 관계
		HTML은 웹 문서의 내용을 작성하는 문서(설계도)
		텍스트로 된 코드
		태그로 구조를 정의
		자체로 동작 X
			<h2>HTML</h2>
			
		DOM
		DOM은 HTML 문서를 브라우저가 객체로 바꿔놓은 결과물
		HTML 요소 하나 = DOM 객체 하나
		- h2 태그 : 하나의 객체
		- id, 내용, 스타일도 객체의 속성
 -->
 </body>
</html>
