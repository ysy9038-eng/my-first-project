<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Document34</title>
 </head>
 <body>
 <!--
	함수 선언 기본 형태
	function 함수명(매개변수){
		실행할 코드;
	}
	
	호출
	함수명();
	함수명(값);
 -->
  <script>
		// 1. 매개변수가 없는 함수
		function say(){
			document.write("안녕하세요. <br>");
		}
		say();	// 호출
		say();
		say();	// 여러번 호출 가능! 재사용 가능
		
		document.write("<hr color='orange'>");
		
		// 2. 매개변수가 있는 함수
		function hello(name){
			document.write(name+"님 반가워요~ <br>");
		}
		hello("java");
		
		document.write("<hr color='skyblue'>");
		
		// 매개변수가 두개지요~
		function add(a, b){
			document.write(a+" + "+b+" = "+(a+b)+"<br>");
		}
		add(3, 5);
		add(10, 20);
  </script>
 </body>
</html>
